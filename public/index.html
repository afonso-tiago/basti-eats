<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf8f3">
  <meta name="description" content="Essensbestellungen und Zahlungen im Team verfolgen.">
  <title>Essensbestellungen</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/fox-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/fox-180.png" sizes="180x180">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4m-7 8h6"/></symbol>
    <symbol id="history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 2.6 6.4M3 12V6m0 6h6m3-5v5l3 2"/></symbol>
    <symbol id="log-out" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3m12-8h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></symbol>
    <symbol id="theme-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
    <symbol id="theme-dark" viewBox="0 0 24 24"><path d="M20.6 15A8.9 8.9 0 0 1 9 3.4 9 9 0 1 0 20.6 15Z"/></symbol>
    <symbol id="theme-auto" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4m-4 0h8"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 6h16m-10 0V4h4v2M6 6l1 14h10l1-14M10 10v6m4-6v6"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-content">
      <nav class="navigation" id="navigation" aria-label="Bestellübersicht" hidden>
        <a href="#today" id="today-link" aria-label="Heute" title="Heute" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#calendar"/></svg></a>
        <a href="#history" id="history-link" aria-label="Verlauf" title="Verlauf"><svg class="icon" aria-hidden="true"><use href="#history"/></svg></a>
      </nav>
      <div class="profile">
        <h1 class="profile-name" id="profile-name" tabindex="-1" dir="auto"></h1>
        <button class="logout-button" id="logout-button" type="button" aria-label="Abmelden" title="Abmelden"><svg class="icon" aria-hidden="true"><use href="#log-out"/></svg></button>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Darstellung ist auf „Automatisch“ eingestellt. Zu „Hell“ wechseln." title="Darstellung ist auf „Automatisch“ eingestellt. Zu „Hell“ wechseln."><svg class="icon" aria-hidden="true"><use href="#theme-auto"/></svg></button>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="composer welcome" id="welcome" aria-labelledby="welcome-title" hidden>
      <img class="welcome-mascot" src="/images/basti-eats-1.webp" width="336" height="378" alt="" loading="lazy" decoding="async">
      <h1 id="welcome-title">Wie heißt du?</h1>
      <form id="name-form" novalidate>
        <label for="user-name">Dein Name</label>
        <div class="inline-form">
          <input id="user-name" name="name" type="text" maxlength="200" autocomplete="name" required>
          <button class="add-button" type="submit">Weiter</button>
        </div>
      </form>
      <p class="notice" id="name-notice" role="status"></p>
    </section>

    <div id="board-view" hidden>
      <header class="page-header" id="board-heading">
        <p class="page-date" id="page-date"><svg class="icon" aria-hidden="true"><use href="#calendar"/></svg><span id="date-label"></span></p>
        <h2 id="history-title" hidden>Bestellverlauf</h2>
      </header>

      <div id="composer" class="composer">
        <form id="request-form" class="inline-form" aria-label="Neue Bestellung" novalidate>
          <div class="request-field">
            <label class="sr-only" for="request-text">Deine Bestellung</label>
            <input id="request-text" name="text" type="text" maxlength="200" required autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="request-suggestions" aria-expanded="false">
            <ul id="request-suggestions" class="suggestions" role="listbox" aria-label="Frühere Bestellungen" hidden></ul>
          </div>
          <button class="add-button request-submit" id="add-button" type="submit" aria-label="Bestellung hinzufügen" title="Bestellung hinzufügen" disabled><svg class="icon" aria-hidden="true"><use href="#plus"/></svg></button>
        </form>
      </div>

      <p id="notice" class="notice" role="status"></p>
      <section class="own-requests" id="own-requests" aria-labelledby="own-requests-heading" hidden>
        <h2 id="own-requests-heading">Deine Bestellungen heute</h2>
        <div id="own-request-list"></div>
      </section>
      <div id="startup" class="requests empty-state" role="status">Bestellungen werden geladen …</div>
      <section class="requests" aria-label="Essensbestellungen" aria-busy="true" id="requests">
        <div class="section-heading" id="today-heading">
          <h2>Heutige Bestellungen</h2>
          <span class="request-count" id="request-count" hidden></span>
        </div>
        <div id="request-tabs" class="request-tabs" role="tablist" aria-label="Bestellungen gruppieren" hidden>
          <button id="requests-tab" type="button" role="tab" aria-selected="true" aria-controls="requests-panel" data-view="requests">Bestellungen</button>
          <button id="payments-tab" type="button" role="tab" aria-selected="false" aria-controls="payments-panel" data-view="payments" tabindex="-1">Zahlungen</button>
        </div>
        <div id="request-groups">
          <div id="requests-panel" role="tabpanel" aria-labelledby="requests-tab" hidden></div>
          <div id="payments-panel" role="tabpanel" aria-labelledby="payments-tab" hidden></div>
        </div>
      </section>
      <img class="delivery-mascot" src="/images/basti-eats-2.webp" width="420" height="328" alt="" loading="lazy" decoding="async">
    </div>
    <noscript><p>Aktiviere JavaScript, um die Bestellübersicht zu nutzen.</p></noscript>
  </main>
</body>
</html>
